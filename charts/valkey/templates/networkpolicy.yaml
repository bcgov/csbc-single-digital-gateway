{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "valkey.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: valkey
          protocol: TCP
      {{- with .Values.networkPolicy.allowedPodSelectors }}
      from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
{{- end }}
