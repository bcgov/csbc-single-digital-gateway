apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.fullname" . }}-config
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
data:
  valkey.conf: |
    # Managed by Helm. `requirepass` is appended at container start from the Secret (never here).
    dir /data
    appendonly yes
    appendfsync everysec
    save {{ .Values.save | quote }}
    {{- with .Values.maxmemory }}
    maxmemory {{ . }}
    maxmemory-policy {{ $.Values.maxmemoryPolicy }}
    {{- end }}
    {{- range .Values.extraConfig }}
    {{ . }}
    {{- end }}
