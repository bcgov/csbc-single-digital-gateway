# platform-api Helm values.
#
# Sensitive env (DATABASE_URL, VALKEY_URL, OIDC_CLIENT_SECRET, AUTH_SESSION_SECRET) MUST live
# in a pre-created Secret named by `existingSecret` — never put them here. Non-sensitive env
# below is rendered into a ConfigMap. Both are injected into the container via envFrom.

replicaCount: 1

# Rollout strategy. These charts default to maxSurge:0 — the single pod is recreated in place
# (brief downtime on upgrade) instead of briefly running two. The requests-metered quota has
# ample headroom for a surge pod (see charts/README.md); raise maxSurge to 1 per app when
# zero-downtime rollouts matter more than strict single-scheduling.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: ghcr.io/bcgov/csbc-single-digital-gateway/platform-api # override per environment
  tag: "" # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pre-created Secret holding: DATABASE_URL, VALKEY_URL, OIDC_CLIENT_SECRET, AUTH_SESSION_SECRET
existingSecret: platform-api-secrets

# Non-sensitive env → ConfigMap. Replace the example hosts per environment.
env:
  NODE_ENV: production
  PORT: "4000"
  LOG_LEVEL: info
  # URL placeholders below MUST be overridden per environment (see charts/single-digital-gateway/
  # values-*.yaml). OIDC_ISSUER is your IdP realm; the others are this app's / the SPA's public host.
  OIDC_ISSUER: https://<oidc-issuer-host>/realms/sdg
  OIDC_CLIENT_ID: platform-api
  OIDC_REDIRECT_URI: https://<platform-api-host>/auth/callback
  AUTH_POST_LOGIN_REDIRECT: https://<platform-web-host>/app
  AUTH_DEFAULT_ROLE: staff
  SESSION_KEY_PREFIX: "sdg:"
  AUTH_RP_LOGOUT: "false"
  AUTH_TOKEN_REFRESH_SKEW_SECONDS: "30"
  AUTH_ALLOWED_ORIGINS: https://<platform-web-host>

# Extra raw env entries (support valueFrom) merged into the app AND migrate containers; they take
# precedence over envFrom keys. Use to source DATABASE_URL from a Crunchy PGO Secret (feature 76)
# instead of putting it in existingSecret:
#   extraEnv:
#     - name: DATABASE_URL
#       valueFrom:
#         secretKeyRef:
#           name: sdg-pguser-sdg
#           key: uri            # or pgbouncer-uri to go through the pooler
extraEnv: []

containerPort: 4000

service:
  type: ClusterIP
  port: 80

route:
  enabled: true
  # Host resolution (first match wins):
  #   host       — an explicit FQDN (needs DNS + a matching cert for edge TLS).
  #   subdomain  — just the prefix; OpenShift appends the cluster's ingress domain, giving
  #                <subdomain>.<apps-domain> served by the cluster's default wildcard cert. This is
  #                the "provide only the first part" option — set it per environment.
  #   (both empty) — OpenShift auto-generates <route-name>-<namespace>.<apps-domain>.
  host: ""
  subdomain: ""
  annotations: {}
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Pre-install/pre-upgrade migrate hook (db-migrate image, feature 74). Enabled here; DISABLE it
# in citizen-portal-api (shared DB) so migrations run exactly once per deploy.
migrations:
  enabled: true
  command: migrate # or "migrate-seed"
  backoffLimit: 2
  image:
    repository: ghcr.io/bcgov/csbc-single-digital-gateway/db-migrate # override per environment
    tag: ""
  # The migrator is short-lived; only its REQUESTS are quota-metered (see charts/README.md),
  # so requests stay lean while limits leave burst headroom for a fast migrate.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

probes:
  liveness:
    path: /health/live
  readiness:
    path: /health/ready

# The namespace quota meters REQUESTS (0.5 CPU / 2Gi shared by the whole stack — see
# charts/README.md); limits are unmetered burst ceilings. The migrate hook
# reuses these limits, and it runs (pre-upgrade) while the old app pod is still up — so this app's
# limit is budgeted to leave room for one concurrent migrate job. See charts/single-digital-gateway/values-*.yaml.
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# OpenShift restricted-v2 assigns the UID/fsGroup — do NOT set runAsUser/fsGroup here.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
