# =============================================================================
# SDG umbrella — DEV environment   (namespace: <slug>-dev)
# =============================================================================
# Install / upgrade the whole stack into the dev namespace from this one file:
#
#   helm dependency build charts/single-digital-gateway            # once — vendors the 7 subcharts
#   helm upgrade --install sdg charts/single-digital-gateway \
#     -n <slug>-dev --create-namespace \
#     -f charts/single-digital-gateway/values-dev.yaml
#
# Namespace budget: 0.5 CPU / 2Gi, ResourceQuota on REQUESTS (requests.cpu / requests.memory —
# limits are NOT quota-metered; they are per-container burst ceilings; see charts/README.md).
# Per-container resources are tuned in each subchart's defaults; this file only carries
# per-environment identity (hosts, image tags, backup policy, log level). Summed container
# REQUESTS, steady state:
#
#   platform-api             25m / 128Mi
#   citizen-portal-api       25m / 128Mi
#   notification-service     25m / 128Mi
#   platform-web             10m /  32Mi
#   citizen-portal-web       10m /  32Mi
#   valkey                   25m /  64Mi
#   postgres (database)      50m / 256Mi
#   postgres repo-host       10m /  48Mi
#   postgres pgbackrest      10m /  16Mi   (sidecar in the instance pod)
#   postgres pgbackrest-cfg   5m /  16Mi   (sidecar in the instance pod)
#   ---------------------------------------------------------------
#   STEADY TOTAL            195m / 848Mi    (of 500m / 2048Mi)
#
# Transient headroom: a migrate hook runs pre-upgrade while the old pod is still up (+50m / 192Mi
# requests, bursting to a 512Mi limit while it parses the 46MB geo file — feature 152; Helm runs
# release hooks serially, so at most ONE migrate Job exists at a time); with a pgBackRest backup
# Job also running (+5m / 32Mi) the worst-case peak is 250m / 1072Mi requests (=<1392Mi with the
# geo burst) — under the 500m / 2048Mi quota.
# Apps keep strategy.maxSurge:0 (recreate in place). Dev disables scheduled backups (no
# recurring backup-Job pods); the operator still runs one initial backup Job (transient).
#
# ASSUMPTION: a couple of operator-managed init containers get their requests/limits from the
# namespace LimitRange defaults. If there is no LimitRange, the quota rejects any pod whose
# containers omit requests on the metered resources — add a LimitRange with small defaults.
# =============================================================================

# ---------------------------------------------------------------------------
# Postgres (Crunchy PGO PostgresCluster) — single instance, backups un-scheduled in dev.
# ---------------------------------------------------------------------------
postgres:
  name: sdg
  instances:
    storage:
      size: 2Gi          # data volume (PVC #1)
  backups:
    storage:
      size: 1Gi          # pgBackRest repo volume (PVC #2)
    schedules:            # dev: no recurring backups (fewer transient Job pods)
      full: ""
      incremental: ""
    retentionFull: "2"

# ---------------------------------------------------------------------------
# Valkey session store. persistence.size is PVC #3 — kept to 1Gi so the three PVCs
# (2Gi + 1Gi + 1Gi = 4Gi) fit a 5Gi namespace storage quota. Set persistence.enabled: false to
# drop this PVC entirely (sessions become ephemeral — a Valkey restart logs everyone out).
# (auth.existingSecret: valkey-secrets must be pre-created in the namespace.)
# ---------------------------------------------------------------------------
valkey:
  persistence:
    size: 1Gi

# ---------------------------------------------------------------------------
# Same-origin topology (feature 78): each audience has ONE external Route — its *-web nginx, which
# serves the SPA at / and reverse-proxies /api/* to the co-located BFF (API_UPSTREAM). The APIs have
# NO external Route (route.enabled: false); they are reached only in-cluster via the web nginx.
# Only the two *-web charts carry a route.subdomain → <subdomain>.<apps-domain> (default wildcard
# cert, edge TLS). Confirm your apps domain and replace `apps.gold.devops.gov.bc.ca` if your cluster's apps domain differs:
#   oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
# OIDC_REDIRECT_URI now carries the /api prefix (through nginx) — register it verbatim in Keycloak.
# OIDC_ISSUER is your IdP realm, not a cluster route. existingSecret secrets must be pre-created.
# ---------------------------------------------------------------------------
platform-api:
  image:
    tag: "dev"       # moving tag CI publishes on `main`; the CI deploy overrides this with the immutable SHA
  route:
    enabled: false       # internal only — reached via platform-web nginx at /api/*
  env:
    LOG_LEVEL: debug
    OIDC_ISSUER: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    OIDC_CLIENT_ID: single-digital-gateway-idir-6379 # BC Gov CSS (IDIR) — set here (helm reverts live oc-edit)
    OIDC_REDIRECT_URI: https://sdg-platform-dev.apps.gold.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-platform-dev.apps.gold.devops.gov.bc.ca/app
    AUTH_ALLOWED_ORIGINS: https://sdg-platform-dev.apps.gold.devops.gov.bc.ca
    # Outbox relay -> notification-service (in-cluster). PREREQUISITE: provision this m2m
    # service-account client in the environment IdP (see charts/single-digital-gateway/values.yaml).
    NOTIFICATION_SERVICE_URL: http://sdg-notification-service:80
    NOTIFICATIONS_M2M_ISSUER: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    NOTIFICATIONS_M2M_CLIENT_ID: sdg-platform-m-2-m-6511
    # Notification email deep-link origins (feature 127).
    CITIZEN_WEB_URL: https://sdg-portal-dev.apps.gold.devops.gov.bc.ca
  migrations:
    # migrate-seed-geo: the pre-upgrade hook migrates, seeds the essential reference data (the
    # Service + Form document types, each with a published v1 — without them the staff console
    # 500s on `GET /v1/services` -> "Service document type is not seeded"), then imports the
    # geographic reference data (countries/states/cities, feature 152). All idempotent (fixed ids
    # / upsert), so running it on every deploy is safe.
    # PREREQUISITE: the geo step fetches ~53MB JSON from raw.githubusercontent.com at runtime, so
    # the migrate Job needs cluster egress to GitHub and ~512Mi to parse the 46MB combined file
    # (the lean 64Mi migrate default would OOM) — resources bumped below.
    command: migrate-seed-geo
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 512Mi
    image:
      tag: "dev"

# ---------------------------------------------------------------------------
# citizen-portal-api (citizen BFF). Migrations stay disabled (platform-api owns the shared DB).
# ---------------------------------------------------------------------------
citizen-portal-api:
  image:
    tag: "dev"
  route:
    enabled: false       # internal only — reached via citizen-portal-web nginx at /api/*
  env:
    LOG_LEVEL: debug
    OIDC_ISSUER: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    OIDC_CLIENT_ID: single-digital-gateway-bc-services-card-6380 # BC Gov CSS (BC Services Card) — set here (helm reverts live oc-edit)
    OIDC_REDIRECT_URI: https://sdg-portal-dev.apps.gold.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-portal-dev.apps.gold.devops.gov.bc.ca/
    AUTH_ALLOWED_ORIGINS: https://sdg-portal-dev.apps.gold.devops.gov.bc.ca
    # Outbox relay -> notification-service (in-cluster). PREREQUISITE: provision this m2m
    # service-account client in the environment IdP (see charts/single-digital-gateway/values.yaml).
    NOTIFICATION_SERVICE_URL: http://sdg-notification-service:80
    NOTIFICATIONS_M2M_ISSUER: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    NOTIFICATIONS_M2M_CLIENT_ID: sdg-citizen-portal-m-2-m-6510
    # Notification email deep-link origins (feature 127).
    CITIZEN_WEB_URL: https://sdg-portal-dev.apps.gold.devops.gov.bc.ca
    PLATFORM_WEB_URL: https://sdg-platform-dev.apps.gold.devops.gov.bc.ca

# ---------------------------------------------------------------------------
# platform-web (staff SPA + front door). Serves the SPA and proxies /api/* → platform-api.
# API_UPSTREAM must match the platform-api Service name (<release>-platform-api:80).
# ---------------------------------------------------------------------------
platform-web:
  image:
    tag: "dev"
  route:
    subdomain: sdg-platform-dev
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-platform-api:80

# ---------------------------------------------------------------------------
# citizen-portal-web (citizen SPA + front door). Proxies /api/* → citizen-portal-api.
# ---------------------------------------------------------------------------
citizen-portal-web:
  image:
    tag: "dev"
  route:
    subdomain: sdg-portal-dev
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-citizen-portal-api:80

# ---------------------------------------------------------------------------
# notification-service (internal-only — no Route). OIDC_ISSUER = the realm hosting the m2m
# service-account clients (must be provisioned in this environment's IdP; the compose Keycloak
# realm import applies only to local dev). SMTP_URL comes from notification-service-secrets.
# ---------------------------------------------------------------------------
notification-service:
  image:
    tag: "dev"
  env:
    LOG_LEVEL: debug
    OIDC_ISSUER: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    # CSS standard realm has no custom audience mapper — each caller's token carries its own
    # client id as aud, so accept EITHER m2m client (ANY-of list, feature 102).
    M2M_AUDIENCE: sdg-platform-m-2-m-6511,sdg-citizen-portal-m-2-m-6510
  migrations:
    image:
      tag: "dev"
