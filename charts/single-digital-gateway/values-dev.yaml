# =============================================================================
# SDG umbrella — DEV environment   (namespace: <slug>-dev)
# =============================================================================
# Install / upgrade the whole stack into the dev namespace from this one file:
#
#   helm dependency build charts/single-digital-gateway            # once — vendors the 6 subcharts
#   helm upgrade --install sdg charts/single-digital-gateway \
#     -n <slug>-dev --create-namespace \
#     -f charts/single-digital-gateway/values-dev.yaml
#
# Namespace budget: 0.5 CPU / 2Gi, ResourceQuota on LIMITS only. The per-container limits are
# tuned in each subchart's defaults; this file only carries per-environment identity (hosts,
# image tags, backup policy, log level). Summed container LIMITS, steady state:
#
#   platform-api            100m / 256Mi
#   citizen-portal-api      100m / 256Mi
#   platform-web             15m /  64Mi
#   citizen-portal-web       15m /  64Mi
#   valkey                   40m / 128Mi
#   postgres (database)      80m / 512Mi
#   postgres repo-host       15m /  96Mi
#   postgres pgbackrest       10m /  48Mi   (sidecar in the instance pod)
#   postgres pgbackrest-cfg    5m /  32Mi   (sidecar in the instance pod)
#   ---------------------------------------------------------------
#   STEADY TOTAL            380m / 1456Mi    (of 500m / 2048Mi)
#
# Transient headroom: platform-api's migrate hook runs pre-upgrade while the old pod is still up
# (+100m / 256Mi) → peak 480m / 1712Mi; even with a pgBackRest backup Job also running (+15m /
# 64Mi) it stays at 495m / 1776Mi, under budget. Apps use strategy.maxSurge:0, so a rollout never
# briefly runs two pods. Dev disables scheduled backups (no recurring backup-Job
# pods); the operator still runs one initial backup Job (+15m / 64Mi, transient).
#
# ASSUMPTION: a couple of operator-managed init containers get their limits from the namespace
# LimitRange defaults. If there is no LimitRange, a limits-only quota rejects any pod with an
# unlimited container — add a LimitRange with small default limits to the namespace.
# =============================================================================

# ---------------------------------------------------------------------------
# Postgres (Crunchy PGO PostgresCluster) — single instance, backups un-scheduled in dev.
# ---------------------------------------------------------------------------
postgres:
  name: sdg
  instances:
    storage:
      size: 2Gi          # data volume (PVC #1)
  backups:
    storage:
      size: 1Gi          # pgBackRest repo volume (PVC #2)
    schedules:            # dev: no recurring backups (fewer transient Job pods)
      full: ""
      incremental: ""
    retentionFull: "2"

# ---------------------------------------------------------------------------
# Valkey session store. persistence.size is PVC #3 — kept to 1Gi so the three PVCs
# (2Gi + 1Gi + 1Gi = 4Gi) fit a 5Gi namespace storage quota. Set persistence.enabled: false to
# drop this PVC entirely (sessions become ephemeral — a Valkey restart logs everyone out).
# (auth.existingSecret: valkey-secrets must be pre-created in the namespace.)
# ---------------------------------------------------------------------------
valkey:
  persistence:
    size: 1Gi

# ---------------------------------------------------------------------------
# Same-origin topology (feature 78): each audience has ONE external Route — its *-web nginx, which
# serves the SPA at / and reverse-proxies /api/* to the co-located BFF (API_UPSTREAM). The APIs have
# NO external Route (route.enabled: false); they are reached only in-cluster via the web nginx.
# Only the two *-web charts carry a route.subdomain → <subdomain>.<apps-domain> (default wildcard
# cert, edge TLS). Confirm your apps domain and replace `apps.silver.devops.gov.bc.ca` if not Silver:
#   oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
# OIDC_REDIRECT_URI now carries the /api prefix (through nginx) — register it verbatim in Keycloak.
# OIDC_ISSUER is your IdP realm, not a cluster route. existingSecret secrets must be pre-created.
# ---------------------------------------------------------------------------
platform-api:
  image:
    tag: "dev"       # moving tag CI publishes on `main`; the CI deploy overrides this with the immutable SHA
  route:
    enabled: false       # internal only — reached via platform-web nginx at /api/*
  env:
    LOG_LEVEL: debug
    OIDC_ISSUER: https://<keycloak-host>/realms/sdg
    OIDC_REDIRECT_URI: https://sdg-platform-dev.apps.silver.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-platform-dev.apps.silver.devops.gov.bc.ca/app
    AUTH_ALLOWED_ORIGINS: https://sdg-platform-dev.apps.silver.devops.gov.bc.ca
  migrations:
    image:
      tag: "dev"

# ---------------------------------------------------------------------------
# citizen-portal-api (citizen BFF). Migrations stay disabled (platform-api owns the shared DB).
# ---------------------------------------------------------------------------
citizen-portal-api:
  image:
    tag: "dev"
  route:
    enabled: false       # internal only — reached via citizen-portal-web nginx at /api/*
  env:
    LOG_LEVEL: debug
    OIDC_ISSUER: https://<keycloak-host>/realms/citizens
    OIDC_REDIRECT_URI: https://sdg-portal-dev.apps.silver.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-portal-dev.apps.silver.devops.gov.bc.ca/
    AUTH_ALLOWED_ORIGINS: https://sdg-portal-dev.apps.silver.devops.gov.bc.ca

# ---------------------------------------------------------------------------
# platform-web (staff SPA + front door). Serves the SPA and proxies /api/* → platform-api.
# API_UPSTREAM must match the platform-api Service name (<release>-platform-api:80).
# ---------------------------------------------------------------------------
platform-web:
  image:
    tag: "dev"
  route:
    subdomain: sdg-platform-dev
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-platform-api:80

# ---------------------------------------------------------------------------
# citizen-portal-web (citizen SPA + front door). Proxies /api/* → citizen-portal-api.
# ---------------------------------------------------------------------------
citizen-portal-web:
  image:
    tag: "dev"
  route:
    subdomain: sdg-portal-dev
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-citizen-portal-api:80
