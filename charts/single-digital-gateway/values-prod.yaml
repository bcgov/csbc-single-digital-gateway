# =============================================================================
# SDG umbrella — PROD environment   (namespace: <slug>-prod)
# =============================================================================
# Install / upgrade the whole stack into the prod namespace from this one file:
#
#   helm dependency build charts/single-digital-gateway            # once — vendors the 7 subcharts
#   helm upgrade --install sdg charts/single-digital-gateway \
#     -n <slug>-prod --create-namespace \
#     -f charts/single-digital-gateway/values-prod.yaml
#
# Namespace budget: 0.5 CPU / 2Gi, ResourceQuota on REQUESTS (requests.cpu / requests.memory —
# limits are NOT quota-metered; they are per-container burst ceilings; see charts/README.md).
# Per-container resources are tuned in each subchart's defaults; this file only carries
# per-environment identity (hosts, image tags, backup policy, log level). Summed container
# REQUESTS, steady state:
#
#   platform-api             25m / 128Mi
#   citizen-portal-api       25m / 128Mi
#   notification-service     25m / 128Mi
#   platform-web             10m /  32Mi
#   citizen-portal-web       10m /  32Mi
#   valkey                   25m /  64Mi
#   postgres (database)      50m / 256Mi
#   postgres repo-host       10m /  48Mi
#   postgres pgbackrest      10m /  16Mi   (sidecar in the instance pod)
#   postgres pgbackrest-cfg   5m /  16Mi   (sidecar in the instance pod)
#   ---------------------------------------------------------------
#   STEADY TOTAL            195m / 848Mi    (of 500m / 2048Mi)
#
# Transient headroom: a migrate hook runs pre-upgrade while the old pod is still up (+50m / 192Mi
# requests, bursting to a 512Mi limit while it parses the 46MB geo file — feature 152; Helm runs
# release hooks serially, so at most ONE migrate Job exists at a time); with a pgBackRest backup
# Job also running (+5m / 32Mi) the worst-case peak is 250m / 1072Mi requests (=<1392Mi with the
# geo burst) — under the 500m / 2048Mi quota.
# Apps keep strategy.maxSurge:0 (recreate in place). Prod keeps weekly-full + daily-incremental
# backups (backup-Job pods are transient).
#
# NOTE: this stack is SINGLE-INSTANCE everywhere (no Postgres HA, no app replicas) — a lean
# default, no longer a quota necessity. With the request headroom above you can raise the app
# replicaCount / strategy.maxSurge and postgres.instances.replicas (to 2); re-check the sums.
#
# ASSUMPTION: a couple of operator-managed init containers get their requests/limits from the
# namespace LimitRange defaults. If there is no LimitRange, the quota rejects any pod whose
# containers omit requests on the metered resources — add a LimitRange with small defaults.
# =============================================================================

# ---------------------------------------------------------------------------
# Postgres — single instance; full weekly + daily incremental backups retained for prod.
# ---------------------------------------------------------------------------
postgres:
  name: sdg
  instances:
    storage:
      size: 2Gi          # data volume (PVC #1) — raise when the prod namespace has more storage
  backups:
    storage:
      size: 1Gi          # pgBackRest repo volume (PVC #2) — grow with the quota + retention needs
    schedules:
      full: "0 1 * * 0"      # weekly full, Sundays 01:00
      incremental: "0 1 * * 1-6"  # daily incremental
    retentionFull: "14"

# Valkey data (PVC #3) → 1Gi, so 2Gi + 1Gi + 1Gi = 4Gi fits a 5Gi namespace storage quota.
# Raise instances/backups/valkey storage once the prod namespace has a larger quota.
valkey:
  persistence:
    size: 1Gi

# ---------------------------------------------------------------------------
# Same-origin topology (feature 78): each audience's *-web nginx is the ONE external Route — it
# serves the SPA and reverse-proxies /api/* to its BFF (API_UPSTREAM). The APIs have no external
# Route. Prod defaults the web hosts to the cluster ingress (route.subdomain); PRODUCTION usually
# wants a VANITY DOMAIN instead — set `route.host: platform.gov.bc.ca` on the *-web charts (with DNS
# + a cert for the custom-domain edge Route) and update the URLs below to match. Confirm the apps
# domain: oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'. OIDC_REDIRECT_URI carries
# /api (register it in Keycloak). OIDC_ISSUER is your IdP realm.
# ---------------------------------------------------------------------------
platform-api:
  image:
    tag: "prod"          # moving tag CI publishes on a Release deploy; the CI deploy overrides with the SHA
  route:
    enabled: false       # internal only — reached via platform-web nginx at /api/*
  env:
    LOG_LEVEL: info
    OIDC_ISSUER: https://loginproxy.gov.bc.ca/auth/realms/standard
    OIDC_CLIENT_ID: single-digital-gateway-idir-6379 # BC Gov CSS (IDIR) — set here (helm reverts live oc-edit)
    OIDC_REDIRECT_URI: https://sdg-platform-prod.apps.gold.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-platform-prod.apps.gold.devops.gov.bc.ca/app
    AUTH_ALLOWED_ORIGINS: https://sdg-platform-prod.apps.gold.devops.gov.bc.ca
    # Outbox relay -> notification-service (in-cluster). PREREQUISITE: provision this m2m
    # service-account client in the environment IdP (see charts/single-digital-gateway/values.yaml).
    NOTIFICATION_SERVICE_URL: http://sdg-notification-service:80
    NOTIFICATIONS_M2M_ISSUER: https://loginproxy.gov.bc.ca/auth/realms/standard
    NOTIFICATIONS_M2M_CLIENT_ID: sdg-platform-m-2-m-6511
    # Notification email deep-link origins (feature 127).
    CITIZEN_WEB_URL: https://sdg-portal-prod.apps.gold.devops.gov.bc.ca
    AUTH_RP_LOGOUT: "true"
  migrations:
    # migrate-seed-geo: the pre-upgrade hook migrates, seeds the essential reference data (the
    # Service + Form document types, each with a published v1 — without them the staff console
    # 500s on `GET /v1/services`), then imports the geographic reference data (countries/states/
    # cities, feature 152). All idempotent (fixed ids / upsert), so safe on every deploy.
    # The geo JSON is VENDORED into the db-migrate image at build time (feature 152), so the Job
    # reads it from disk — NO runtime egress. It still needs ~512Mi to parse the 46MB combined file
    # (the lean 64Mi migrate default would OOM) — resources bumped below.
    command: migrate-seed-geo
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 512Mi
    image:
      tag: "prod"

# ---------------------------------------------------------------------------
# citizen-portal-api (citizen BFF). Migrations disabled (platform-api owns the shared DB).
# ---------------------------------------------------------------------------
citizen-portal-api:
  image:
    tag: "prod"
  route:
    enabled: false       # internal only — reached via citizen-portal-web nginx at /api/*
  env:
    LOG_LEVEL: info
    OIDC_ISSUER: https://loginproxy.gov.bc.ca/auth/realms/standard
    OIDC_CLIENT_ID: single-digital-gateway-bc-services-card-6380 # BC Gov CSS (BC Services Card) — set here (helm reverts live oc-edit)
    OIDC_REDIRECT_URI: https://sdg-portal-prod.apps.gold.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-portal-prod.apps.gold.devops.gov.bc.ca/
    AUTH_ALLOWED_ORIGINS: https://sdg-portal-prod.apps.gold.devops.gov.bc.ca
    # Outbox relay -> notification-service (in-cluster). PREREQUISITE: provision this m2m
    # service-account client in the environment IdP (see charts/single-digital-gateway/values.yaml).
    NOTIFICATION_SERVICE_URL: http://sdg-notification-service:80
    NOTIFICATIONS_M2M_ISSUER: https://loginproxy.gov.bc.ca/auth/realms/standard
    NOTIFICATIONS_M2M_CLIENT_ID: sdg-citizen-portal-m-2-m-6510
    # Notification email deep-link origins (feature 127).
    CITIZEN_WEB_URL: https://sdg-portal-prod.apps.gold.devops.gov.bc.ca
    PLATFORM_WEB_URL: https://sdg-platform-prod.apps.gold.devops.gov.bc.ca
    AUTH_RP_LOGOUT: "true"

# ---------------------------------------------------------------------------
# platform-web (staff SPA + front door). Serves the SPA and proxies /api/* → platform-api.
# ---------------------------------------------------------------------------
platform-web:
  image:
    tag: "prod"
  route:
    subdomain: sdg-platform-prod
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-platform-api:80

# ---------------------------------------------------------------------------
# citizen-portal-web (citizen SPA + front door). Proxies /api/* → citizen-portal-api.
# ---------------------------------------------------------------------------
citizen-portal-web:
  image:
    tag: "prod"
  route:
    subdomain: sdg-portal-prod
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-citizen-portal-api:80

# ---------------------------------------------------------------------------
# notification-service (internal-only — no Route). OIDC_ISSUER = the realm hosting the m2m
# service-account clients (must be provisioned in this environment's IdP; the compose Keycloak
# realm import applies only to local dev). SMTP_URL comes from notification-service-secrets.
# ---------------------------------------------------------------------------
notification-service:
  image:
    tag: "prod"
  env:
    LOG_LEVEL: info
    OIDC_ISSUER: https://loginproxy.gov.bc.ca/auth/realms/standard
    # CSS standard realm has no custom audience mapper — each caller's token carries its own
    # client id as aud, so accept EITHER m2m client (ANY-of list, feature 102).
    M2M_AUDIENCE: sdg-platform-m-2-m-6511,sdg-citizen-portal-m-2-m-6510
  migrations:
    image:
      tag: "prod"
