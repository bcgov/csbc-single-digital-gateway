# =============================================================================
# SDG umbrella — shared base values (applied UNDER every values-<env>.yaml)
# =============================================================================
# Cross-environment wiring that is identical in dev/test/prod lives here so it is not triplicated
# in the per-env files. Helm loads this file first, then layers values-<env>.yaml on top.
#
# DATABASE_URL is sourced straight from the Secret the Crunchy Postgres Operator generates for the
# cluster: `<postgres.name>-pguser-<postgres.database.user>` = **sdg-pguser-sdg**, key **uri**
# (a full postgresql:// connection string to the primary). So DATABASE_URL does NOT need to be
# placed in the apps' existingSecret — and because extraEnv is applied to BOTH the app container
# and the pre-upgrade migrate Job (and takes precedence over envFrom), migrations get it too.
#
#   • Rename the cluster (postgres.name) or DB user (postgres.database.user)? update the
#     secretKeyRef.name below to match `<name>-pguser-<user>`.
#   • Enable the pgBouncer pooler (postgres.pgbouncer.enabled=true)? switch key `uri` → `pgbouncer-uri`.
#   • existingSecret is still required for the other secrets (OIDC_CLIENT_SECRET,
#     AUTH_SESSION_SECRET, VALKEY_URL) — only DATABASE_URL moves out of it.
#
# DB TLS: Crunchy Postgres requires TLS (its pg_hba.conf has only hostssl entries). PGSSLMODE +
# DATABASE_CA_CERT (below) make the client verify the server against the cluster's CA:
#   • PGSSLMODE=verify-full — encrypt + verify the CA chain + the hostname. If the server cert's
#     SANs don't include the connection host (some Crunchy service DNS names), switch to verify-ca
#     (chain only). no-verify = encrypt without any verification (fallback).
#   • DATABASE_CA_CERT — the CA PEM, sourced from the operator's cluster-cert Secret
#     (`<postgres.name>-cluster-cert`, key `ca.crt`). Confirm that name on your cluster:
#     `oc get secret sdg-cluster-cert -n <ns> -o jsonpath='{.data.ca\.crt}' | base64 -d | head -1`
#
# FIRST-INSTALL ORDERING (important): the migrate Job is a pre-install/pre-upgrade Helm hook, and
# Helm runs pre-install hooks BEFORE any release resource — including the PostgresCluster CR. On a
# brand-new namespace the operator has not yet created `sdg-pguser-sdg` (nor a ready database), so
# a single `helm install` would run the migrate hook before the secret/DB exist. Do a phased
# FIRST install instead (upgrades are fine — the DB already exists):
#
#     # 1) bring up Postgres (+ Valkey + apps) WITHOUT the migrate hook
#     helm install sdg charts/single-digital-gateway -n <slug>-dev --create-namespace \
#       -f charts/single-digital-gateway/values-dev.yaml \
#       --set platform-api.migrations.enabled=false
#     # 2) wait for the cluster's user Secret + a ready primary
#     oc -n <slug>-dev wait --for=condition=Ready pod -l postgres-operator.crunchydata.com/role=master --timeout=300s
#     # 3) upgrade with migrations enabled (default) → pre-upgrade migrate runs against the ready DB
#     helm upgrade sdg charts/single-digital-gateway -n <slug>-dev \
#       -f charts/single-digital-gateway/values-dev.yaml
# =============================================================================

platform-api:
  extraEnv:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: sdg-pguser-sdg # <postgres.name>-pguser-<postgres.database.user>
          key: uri # full postgresql:// URI to the primary (use `pgbouncer-uri` if pooling)
    - name: PGSSLMODE
      value: "verify-full" # or "verify-ca" if the cert SANs don't match the host; "no-verify" to skip
    - name: DATABASE_CA_CERT
      valueFrom:
        secretKeyRef:
          name: sdg-cluster-cert # <postgres.name>-cluster-cert (the operator's cluster CA)
          key: ca.crt

citizen-portal-api:
  extraEnv:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: sdg-pguser-sdg
          key: uri
    - name: PGSSLMODE
      value: "verify-full"
    - name: DATABASE_CA_CERT
      valueFrom:
        secretKeyRef:
          name: sdg-cluster-cert
          key: ca.crt

# ---------------------------------------------------------------------------
# Notifications database — a SECOND database/user in the same Crunchy cluster. The operator
# provisions sdg_notifications + the `notifications` user and generates the
# `sdg-pguser-notifications` Secret notification-service consumes below.
#
# PG15+ public-schema grant: databaseInitSQL runs ONLY at initial cluster creation, so
# initSQL.extra below covers FRESH clusters. For an EXISTING cluster, apply once by hand:
#   oc exec -n <ns> statefulset/sdg-instance1 -c database -- \
#     psql -d sdg_notifications -c 'GRANT ALL ON SCHEMA public TO notifications;'
# ---------------------------------------------------------------------------
postgres:
  extraUsers:
    - name: notifications
      databases:
        - sdg_notifications
  initSQL:
    extra: |
      \c sdg_notifications
      GRANT ALL ON SCHEMA public TO notifications;

# ---------------------------------------------------------------------------
# notification-service — internal-only (no Route). NOTIFICATION_DATABASE_URL comes from the
# operator-generated pguser Secret; the migrate hook inherits extraEnv automatically. SMTP_URL
# lives in the pre-created notification-service-secrets Secret.
#
# IdP PREREQUISITE: the m2m service-account clients (platform-api-m2m / citizen-portal-api-m2m,
# with a notification-service audience on their access tokens) exist only in the LOCAL compose
# Keycloak — provision equivalents in each environment's IdP and set OIDC_ISSUER /
# NOTIFICATIONS_M2M_* in values-<env>.yaml before enabling the relay there. If that IdP can't
# add a custom audience mapper (e.g. the CSS standard realm), set the notification-service
# M2M_AUDIENCE to the comma-separated m2m client ids instead (ANY-of match).
# ---------------------------------------------------------------------------
notification-service:
  extraEnv:
    - name: NOTIFICATION_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: sdg-pguser-notifications # <postgres.name>-pguser-<extraUsers[].name>
          key: uri
    - name: PGSSLMODE
      value: "verify-full"
    - name: NOTIFICATION_DATABASE_CA_CERT
      valueFrom:
        secretKeyRef:
          name: sdg-cluster-cert
          key: ca.crt
