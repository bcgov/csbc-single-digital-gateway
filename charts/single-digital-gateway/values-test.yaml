# =============================================================================
# SDG umbrella — TEST environment   (namespace: <slug>-test)
# =============================================================================
# Install / upgrade the whole stack into the test namespace from this one file:
#
#   helm dependency build charts/single-digital-gateway            # once — vendors the 7 subcharts
#   helm upgrade --install sdg charts/single-digital-gateway \
#     -n <slug>-test --create-namespace \
#     -f charts/single-digital-gateway/values-test.yaml
#
# Namespace budget: 0.5 CPU / 2Gi, ResourceQuota on REQUESTS (requests.cpu / requests.memory —
# limits are NOT quota-metered; they are per-container burst ceilings; see charts/README.md).
# Per-container resources are tuned in each subchart's defaults; this file only carries
# per-environment identity (hosts, image tags, backup policy, log level). Summed container
# REQUESTS, steady state:
#
#   platform-api             25m / 128Mi
#   citizen-portal-api       25m / 128Mi
#   notification-service     25m / 128Mi
#   platform-web             10m /  32Mi
#   citizen-portal-web       10m /  32Mi
#   valkey                   25m /  64Mi
#   postgres (database)      50m / 256Mi
#   postgres repo-host       10m /  48Mi
#   postgres pgbackrest      10m /  16Mi   (sidecar in the instance pod)
#   postgres pgbackrest-cfg   5m /  16Mi   (sidecar in the instance pod)
#   ---------------------------------------------------------------
#   STEADY TOTAL            195m / 848Mi    (of 500m / 2048Mi)
#
# Transient headroom: a migrate hook runs pre-upgrade while the old pod is still up (+25m / 64Mi;
# Helm runs release hooks serially, so at most ONE migrate Job exists at a time); with a pgBackRest
# backup Job also running (+5m / 32Mi) the worst-case peak is 225m / 944Mi — under half the quota.
# Apps keep strategy.maxSurge:0 (recreate in place). Test keeps only a weekly full backup
# (one recurring Job).
#
# ASSUMPTION: a couple of operator-managed init containers get their requests/limits from the
# namespace LimitRange defaults. If there is no LimitRange, the quota rejects any pod whose
# containers omit requests on the metered resources — add a LimitRange with small defaults.
# =============================================================================

# ---------------------------------------------------------------------------
# Postgres — single instance; weekly full backup only in test.
# ---------------------------------------------------------------------------
postgres:
  name: sdg
  instances:
    storage:
      size: 2Gi          # data volume (PVC #1)
  backups:
    storage:
      size: 1Gi          # pgBackRest repo volume (PVC #2)
    schedules:
      full: "0 2 * * 0"   # weekly full, Sundays 02:00
      incremental: ""      # no daily incrementals in test
    retentionFull: "4"

# Valkey data (PVC #3) → 1Gi, so 2Gi + 1Gi + 1Gi = 4Gi fits a 5Gi namespace storage quota.
valkey:
  persistence:
    size: 1Gi

# ---------------------------------------------------------------------------
# Same-origin topology (feature 78): each audience's *-web nginx is the ONE external Route — it
# serves the SPA and reverse-proxies /api/* to its BFF (API_UPSTREAM). The APIs have no external
# Route. Confirm the apps domain: oc get ingresses.config/cluster -o jsonpath='{.spec.domain}' and
# replace `apps.gold.devops.gov.bc.ca` if your cluster's apps domain differs. OIDC_REDIRECT_URI carries /api (register
# it in Keycloak). OIDC_ISSUER is your IdP realm.
# ---------------------------------------------------------------------------
platform-api:
  image:
    tag: "test"        # moving tag CI publishes on a v* deploy; the CI deploy overrides with the SHA
  route:
    enabled: false       # internal only — reached via platform-web nginx at /api/*
  env:
    LOG_LEVEL: info
    OIDC_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    OIDC_CLIENT_ID: single-digital-gateway-idir-6379 # BC Gov CSS (IDIR) — set here (helm reverts live oc-edit)
    OIDC_REDIRECT_URI: https://sdg-platform-test.apps.gold.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-platform-test.apps.gold.devops.gov.bc.ca/app
    AUTH_ALLOWED_ORIGINS: https://sdg-platform-test.apps.gold.devops.gov.bc.ca
    # Outbox relay -> notification-service (in-cluster). PREREQUISITE: provision this m2m
    # service-account client in the environment IdP (see charts/single-digital-gateway/values.yaml).
    NOTIFICATION_SERVICE_URL: http://sdg-notification-service:80
    NOTIFICATIONS_M2M_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    NOTIFICATIONS_M2M_CLIENT_ID: platform-api-m2m
    # Notification email deep-link origins (feature 127).
    CITIZEN_WEB_URL: https://sdg-portal-test.apps.gold.devops.gov.bc.ca
  migrations:
    # migrate-seed (not plain migrate): the pre-upgrade hook must also seed the essential
    # reference data — the Service + Form document types (each with a published v1) — or the
    # staff console 500s on the first data call (`GET /v1/services`). Idempotent (fixed ids +
    # onConflictDoNothing), so safe on every deploy.
    command: migrate-seed
    image:
      tag: "test"

# ---------------------------------------------------------------------------
# citizen-portal-api (citizen BFF). Migrations disabled (platform-api owns the shared DB).
# ---------------------------------------------------------------------------
citizen-portal-api:
  image:
    tag: "test"
  route:
    enabled: false       # internal only — reached via citizen-portal-web nginx at /api/*
  env:
    LOG_LEVEL: info
    OIDC_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    OIDC_CLIENT_ID: single-digital-gateway-bc-services-card-6380 # BC Gov CSS (BC Services Card) — set here (helm reverts live oc-edit)
    OIDC_REDIRECT_URI: https://sdg-portal-test.apps.gold.devops.gov.bc.ca/api/auth/callback
    AUTH_POST_LOGIN_REDIRECT: https://sdg-portal-test.apps.gold.devops.gov.bc.ca/
    AUTH_ALLOWED_ORIGINS: https://sdg-portal-test.apps.gold.devops.gov.bc.ca
    # Outbox relay -> notification-service (in-cluster). PREREQUISITE: provision this m2m
    # service-account client in the environment IdP (see charts/single-digital-gateway/values.yaml).
    NOTIFICATION_SERVICE_URL: http://sdg-notification-service:80
    NOTIFICATIONS_M2M_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    NOTIFICATIONS_M2M_CLIENT_ID: citizen-portal-api-m2m
    # Notification email deep-link origins (feature 127).
    CITIZEN_WEB_URL: https://sdg-portal-test.apps.gold.devops.gov.bc.ca
    PLATFORM_WEB_URL: https://sdg-platform-test.apps.gold.devops.gov.bc.ca

# ---------------------------------------------------------------------------
# platform-web (staff SPA + front door). Serves the SPA and proxies /api/* → platform-api.
# ---------------------------------------------------------------------------
platform-web:
  image:
    tag: "test"
  route:
    subdomain: sdg-platform-test
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-platform-api:80

# ---------------------------------------------------------------------------
# citizen-portal-web (citizen SPA + front door). Proxies /api/* → citizen-portal-api.
# ---------------------------------------------------------------------------
citizen-portal-web:
  image:
    tag: "test"
  route:
    subdomain: sdg-portal-test
  env:
    BFF_ORIGIN: /api
    API_UPSTREAM: sdg-citizen-portal-api:80

# ---------------------------------------------------------------------------
# notification-service (internal-only — no Route). OIDC_ISSUER = the realm hosting the m2m
# service-account clients (must be provisioned in this environment's IdP; the compose Keycloak
# realm import applies only to local dev). SMTP_URL comes from notification-service-secrets.
# ---------------------------------------------------------------------------
notification-service:
  image:
    tag: "test"
  env:
    LOG_LEVEL: info
    OIDC_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
  migrations:
    image:
      tag: "test"
