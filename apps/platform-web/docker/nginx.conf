# SPA static server for platform-web. Runs inside nginxinc/nginx-unprivileged, which listens
# on 8080 as a non-root user (OpenShift/K8s friendly). Replaces the image's default.conf.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Content-hashed build assets — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App shell + runtime config change per deploy/env — never cache. Unknown paths fall back
    # to the SPA shell for client-side (TanStack) routing.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
