# Local development services. Not for any non-local environment — the credentials are
# intentionally trivial. Start with `docker compose up -d`, then run migrations:
#   npm run db:migrate -w @repo/database
# Host port defaults to 5432; override with POSTGRES_PORT if another Postgres already
# holds it (and update DATABASE_URL's port to match).
services:
  postgres:
    image: postgres:16-alpine
    container_name: sdg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sdg
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sdg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sdg']
      interval: 5s
      timeout: 5s
      retries: 5

  # Session store for the BFF (Redis wire protocol). Host port 6380 to avoid 6379 conflicts.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: sdg-valkey
    restart: unless-stopped
    ports:
      - '${VALKEY_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # OIDC IdP for local/CI. Dev mode + realm import (confidential client + seeded test user).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sdg-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/localhost/8080 && echo -e "GET /realms/sdg HTTP/1.0\\n\\n" >&3 && cat <&3 | grep -q "200 OK"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  sdg-postgres-data:
